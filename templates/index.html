<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veri Tabanı Yönetim Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <style>
        body { background-color: #121212; color: #e0e0e0; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        .form-control, .form-select { background-color: #2a2a2a; color: #fff; border: 1px solid #444; }
        .form-control:focus, .form-select:focus { background-color: #333; color: #fff; border-color: #198754; box-shadow: none; }
        .result-card { background-color: #1a1a1a; border-left: 5px solid #198754; display: none; }
        .form-label { color: #ffffff !important; font-weight: 500; }
        
        /* YENİ: Başlıkları, Versiyon Yazısını ve Tablo Listesini Beyaza Çevirir */
        #resultBox h4, #resultBox h5, #resultBox p { color: #ffffff !important; }
        #dbVersion { color: #ffffff !important; font-weight: bold; }
        #tableList li { color: #ffffff !important; background-color: #252525 !important; }
        /* Kayıtlı Öğrenciler Listesi başlığını beyaz yapar */
        #studentPanel h6 { color: #ffffff !important; font-weight: bold; }
    </style>
</head>
<body>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <h2 class="text-center text-success mb-4"><strong>Veri Tabanı Bağlantı Paneli</strong></h2>
            
            <div class="card p-4 mb-4 shadow-lg">
                <form id="dbForm">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Veri Tabanı Türü</label>
                            <select class="form-select" id="db_type" required>
                                <option value="postgresql">PostgreSQL</option>
                                <option value="mysql">MySQL</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Host / Sunucu</label>
                            <input type="text" class="form-control" id="host" value="localhost" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Port</label>
                            <input type="number" class="form-control" id="port" value="5432" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Kullanıcı Adı (User)</label>
                            <input type="text" class="form-control" id="user" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Şifre (Password)</label>
                            <input type="password" class="form-control" id="password">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Veri Tabanı Adı (Database)</label>
                            <input type="text" class="form-control" id="database" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2">Veri Tabanına Bağlan</button>
                </form>
            </div>

            <div id="statusAlert" class="alert d-none" role="alert"></div>

            <div id="resultBox" class="card p-4 result-card shadow-lg mb-4">
                <h4 class="text-success mb-3"><strong>Bağlantı Başarılı!</strong></h4>
                <p><strong>Veri Tabanı Versiyonu:</strong> <span id="dbVersion" class="text-warning font-monospace"></span></p>
                
                <h5 class="mt-4">Mevcut Tablolar:</h5>
                <ul id="tableList" class="list-group mb-3">
                    </ul>

                <div id="studentPanel" class="mt-4 border-top pt-3" style="display: none;">
                    <h5 class="text-success mb-3"><strong>Öğrenci Kayıt ve Takip Sistemi</strong></h5>
                    <div class="row">
                        <div class="col-md-5 mb-3">
                            <div class="p-3 rounded" style="background-color: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);">
                                <h6 id="formTitle">Yeni Öğrenci Ekle</h6>
                                <div class="mb-2">
                                    <label class="form-label text-light">Öğrenci Adı Soyadı</label>
                                    <input type="text" class="form-control bg-dark text-white" id="studentName" placeholder="Örn: Yaren Taş">
                                </div>
                                <div class="mb-2">
                                    <label class="form-label text-light">Bölümü</label>
                                    <input type="text" class="form-control bg-dark text-white" id="studentDept" placeholder="Örn: Yönetim Bilişim Sistemleri">
                                </div>
                                <div class="mb-3">
    <label class="form-label text-light">Genel Not Ortalaması (GNO)</label>
    <input type="number" step="0.01" min="0" max="4" class="form-control bg-dark text-white" id="studentAvg" placeholder="Örn: 3.00">
</div>
                                <button type="button" id="btnAddStudent" class="btn btn-success w-100 fw-bold">Öğrenciyi Kaydet</button>
                            </div>
                        </div>
                        <div class="col-md-12 mb-4 mt-3">
                            <h6>Kayıtlı Öğrenciler Listesi</h6>
                            <div class="table-responsive">
                                <table class="table table-dark table-striped table-hover small">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Adı Soyadı</th>
                                            <th>Bölümü</th>
                                            <th>İşlemler</th>
                                        </tr>
                                    </thead>
                                    <tbody id="studentTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="sqlPanel" class="mt-4 border-top pt-3" style="display: none;">
                    <h5 class="text-success mb-2"><strong>SQL Sorgu Konsolu</strong></h5>
                    <div class="mb-3">
                        <textarea class="form-control bg-dark text-white font-monospace" id="sqlQuery" rows="3" placeholder="Örn: SELECT * FROM ogrenciler;"></textarea>
                    </div>
                    <button type="button" id="btnExecuteSql" class="btn btn-warning w-100 fw-bold btn-sm">Sorguyu Çalıştır</button>
                    
                    <div id="sqlResultBox" class="mt-3 p-2 rounded" style="display: none; background-color: rgba(255,255,255,0.05);">
                        <div id="sqlStatusAlert" class="alert small p-2"></div>
                        <div class="table-responsive">
                            <table class="table table-dark table-striped table-hover small">
                                <thead id="tableHead"></thead>
                                <tbody id="tableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('db_type').addEventListener('change', (e) => {
    document.getElementById('port').value = e.target.value === 'postgresql' ? '5432' : '3306';
});
</script>

<script>
// 1. VERI TABANI BAGLANTISI
document.getElementById('dbForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusAlert = document.getElementById('statusAlert');
    const resultBox = document.getElementById('resultBox');
    
    statusAlert.className = 'alert alert-info d-block';
    statusAlert.innerText = 'Bağlantı kuruluyor...';
    resultBox.style.display = 'none';

    const formData = {
        db_type: document.getElementById('db_type').value,
        host: document.getElementById('host').value,
        port: document.getElementById('port').value,
        user: document.getElementById('user').value,
        password: document.getElementById('password').value,
        database: document.getElementById('database').value
    };

    try {
        const response = await fetch('/connect', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });
        const data = await response.json();

        if (data.success) {
            statusAlert.className = 'alert alert-success d-block';
            statusAlert.innerText = data.message;
            resultBox.style.display = 'block';
            document.getElementById('dbVersion').innerText = data.details.version;
            
            const tableList = document.getElementById('tableList');
            tableList.innerHTML = '';
            data.details.tables.forEach(table => {
                tableList.innerHTML += `<li class="list-group-item bg-dark text-light border-secondary font-monospace">${table}</li>`;
            });

            document.getElementById('sqlPanel').style.display = 'block';
            document.getElementById('studentPanel').style.display = 'block';
            fetchAndRenderStudents(); 
        } else {
            statusAlert.className = 'alert alert-danger d-block';
            statusAlert.innerText = data.message;
        }
    } catch (error) {
        statusAlert.className = 'alert alert-danger d-block';
        statusAlert.innerText = 'Sunucuya bağlanırken bir hata oluştu.';
    }
});

// 2. READ (LİSTELEME)
async function fetchAndRenderStudents() {
    const tableBody = document.getElementById('studentTableBody');
    tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Yükleniyor...</td></tr>';

    const formData = {
        db_type: document.getElementById('db_type').value,
        host: document.getElementById('host').value,
        port: document.getElementById('port').value,
        user: document.getElementById('user').value,
        password: document.getElementById('password').value,
        database: document.getElementById('database').value
    };

    try {
        const response = await fetch('/get_students', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });
        const data = await response.json();

        if (data.success) {
            tableBody.innerHTML = '';
            if (data.students.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Henüz kayıtlı öğrenci yok.</td></tr>';
                return;
            }
            data.students.forEach(student => {
                const avgScore = student.ortalama !== undefined && student.ortalama !== null ? Number(student.ortalama).toFixed(2) : '0.00';
                tableBody.innerHTML += `
                    <tr>
                        <td>${student.id}</td>
                        <td class="fw-bold text-success">${student.isim}</td>
                        <td>${student.bolum}</td>
                        <td class="text-warning fw-bold">${avgScore}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-warning me-1" style="font-size:11px;" onclick="prepareUpdate(${student.id}, '${student.isim}', '${student.bolum}', ${avgScore})">Düzenle</button>
                            <button class="btn btn-sm btn-outline-danger" style="font-size:11px;" onclick="deleteStudent(${student.id})">Sil</button>
                        </td>
                    </tr>
                `;
            });
        } else {
            tableBody.innerHTML = `<tr><td colspan="5" class="text-center text-danger">Hata: ${data.message}</td></tr>`;
        }
    } catch (error) {
        tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">Bağlantı hatası.</td></tr>';
    }
}

// 3. CREATE & UPDATE (KAYDETME VE GÜNCELLEME)
let currentEditId = null;

document.getElementById('btnAddStudent').addEventListener('click', async () => {
    const name = document.getElementById('studentName').value;
    const dept = document.getElementById('studentDept').value;
    const avg = document.getElementById('studentAvg') ? document.getElementById('studentAvg').value : 0.00;

    if (!name || !dept) {
        alert('Lütfen Ad ve Bölüm alanlarını doldurun!');
        return;
    }

    if (currentEditId !== null) {
        const updateData = {
            db_type: document.getElementById('db_type').value,
            host: document.getElementById('host').value,
            port: document.getElementById('port').value,
            user: document.getElementById('user').value,
            password: document.getElementById('password').value,
            database: document.getElementById('database').value,
            student_id: currentEditId,
            student_name: name,
            student_dept: dept,
            student_avg: avg
        };

        try {
            const response = await fetch('/update_student', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updateData)
            });
            const data = await response.json();
            if (data.success) {
                currentEditId = null;
                document.getElementById('studentName').value = '';
                document.getElementById('studentDept').value = '';
                if(document.getElementById('studentAvg')) document.getElementById('studentAvg').value = '';
                
                const mainBtn = document.getElementById('btnAddStudent');
                mainBtn.innerText = 'Öğrenciyi Kaydet';
                mainBtn.className = 'btn btn-success w-100 fw-bold';
                
                fetchAndRenderStudents();
            } else {
                alert('Güncelleme Hatası: ' + data.message);
            }
        } catch (error) {
            alert('Sunucu hatası.');
        }
        return;
    }

    const formData = {
        db_type: document.getElementById('db_type').value,
        host: document.getElementById('host').value,
        port: document.getElementById('port').value,
        user: document.getElementById('user').value,
        password: document.getElementById('password').value,
        database: document.getElementById('database').value,
        student_name: name,
        student_dept: dept,
        student_avg: avg
    };

    try {
        const response = await fetch('/add_student', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });
        const data = await response.json();

        if (data.success) {
            document.getElementById('studentName').value = '';
            document.getElementById('studentDept').value = '';
            if(document.getElementById('studentAvg')) document.getElementById('studentAvg').value = '';
            fetchAndRenderStudents();
        } else {
            alert('Hata: ' + data.message);
        }
    } catch (error) {
        alert('Sunucu hatası.');
    }
});

// 4. DELETE (SİLME)
async function deleteStudent(studentId) {
    if (!confirm('Bu öğrenciyi silmek istediğinize emin misiniz?')) return;

    const formData = {
        db_type: document.getElementById('db_type').value,
        host: document.getElementById('host').value,
        port: document.getElementById('port').value,
        user: document.getElementById('user').value,
        password: document.getElementById('password').value,
        database: document.getElementById('database').value,
        student_id: studentId
    };

    try {
        const response = await fetch('/delete_student', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });
        const data = await response.json();

        if (data.success) {
            fetchAndRenderStudents();
        } else {
            alert('Silme Hatası: ' + data.message);
        }
    } catch (error) {
        alert('Sunucu hatası.');
    }
}

// 5. PREPARE UPDATE (DÜZENLEMEYE HAZIRLA)
function prepareUpdate(id, name, dept, avg) {
    currentEditId = id;
    document.getElementById('studentName').value = name;
    document.getElementById('studentDept').value = dept;
    if(document.getElementById('studentAvg')) document.getElementById('studentAvg').value = avg;
    
    const mainBtn = document.getElementById('btnAddStudent');
    mainBtn.innerText = 'Değişiklikleri Kaydet (Güncelle)';
    mainBtn.className = 'btn btn-warning w-100 fw-bold';
}

// 6. SQL KONSOLU
document.getElementById('btnExecuteSql').addEventListener('click', async () => {
    const sqlQuery = document.getElementById('sqlQuery').value;
    const sqlResultBox = document.getElementById('sqlResultBox');
    const sqlStatusAlert = document.getElementById('sqlStatusAlert');
    const tableHead = document.getElementById('tableHead');
    const tableBody = document.getElementById('tableBody');

    sqlResultBox.style.display = 'block';
    sqlStatusAlert.className = 'alert alert-info p-2';
    sqlStatusAlert.innerText = 'Sorgu yürütülüyor...';
    tableHead.innerHTML = '';
    tableBody.innerHTML = '';

    const formData = {
        db_type: document.getElementById('db_type').value,
        host: document.getElementById('host').value,
        port: document.getElementById('port').value,
        user: document.getElementById('user').value,
        password: document.getElementById('password').value,
        database: document.getElementById('database').value,
        sql_query: sqlQuery
    };

    try {
        const response = await fetch('/execute_sql', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });
        const data = await response.json();

        if (data.success) {
            sqlStatusAlert.className = 'alert alert-success p-2';
            sqlStatusAlert.innerText = data.message;

            if (data.is_select && data.rows.length > 0) {
                let thr = '<tr>';
                data.columns.forEach(col => thr += `<th>${col}</th>`);
                thr += '</tr>';
                tableHead.innerHTML = thr;

                data.rows.forEach(row => {
                    let tbr = '<tr>';
                    data.columns.forEach(col => tbr += `<td>${row[col] !== null ? row[col] : 'NULL'}</td>`);
                    tbr += '</tr>';
                    tableBody.innerHTML += tbr;
                });
            }
        } else {
            sqlStatusAlert.className = 'alert alert-danger p-2';
            sqlStatusAlert.innerText = data.message;
        }
    } catch (error) {
        sqlStatusAlert.className = 'alert alert-danger p-2';
        sqlStatusAlert.innerText = 'Sorgu gönderilirken hata oluştu.';
    }
});
</script>
</body>
</html>
